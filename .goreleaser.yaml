version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ngts-warden
    main: ./cmd/ngts-warden
    binary: ngts-warden
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
